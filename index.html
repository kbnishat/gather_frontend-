<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seu-frontend</title>
    <script>
      if (window.location.search.startsWith('?/')) {
        const route = window.location.search.slice(1).split('&')[0]
        window.history.replaceState(null, '', window.location.pathname.replace(/\/$/, '') + route)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
